[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepseek-agent"
version = "0.1.0"
description = "A polished streaming terminal agent for the DeepSeek API"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "mmmlasu"}]
dependencies = ["httpx>=0.27,<1", "rich>=13.7,<15", "typer>=0.12,<1"]

[project.optional-dependencies]
dev = ["mypy>=1.11,<2", "pytest>=8.2,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.6,<1"]

[project.scripts]
deepseek-agent = "deepseek_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/deepseek_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["deepseek_agent"]
